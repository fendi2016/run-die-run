<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>CURSED</title>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <img class="badge-icon" src="/assets/hazards/saw-icon.png" alt="" />
        <span class="badge-text">CURSED</span>
      </div>

      <div class="header">
        <span class="chip stat">
          <span id="stat-value">···</span>
          <span class="stat-label">RUNS</span>
        </span>
      </div>

      <div class="scene">
        <div class="floor"></div>
        <div class="spike-row"></div>
        <div class="saw saw-a"></div>
        <div class="saw saw-b"></div>

        <div class="menu-stack">
          <button type="button" class="play-button" id="play-button">
            Play
          </button>
          <button type="button" class="secondary-button" id="build-button">
            Build
          </button>
          <button type="button" class="secondary-button" id="browse-button">
            Browse
          </button>
        </div>

        <div class="attribution">
          <span class="attribution-label">Made by</span>
          <span class="attribution-name" id="creator-name">CURSED</span>
        </div>
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
