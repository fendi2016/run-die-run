<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>SKETCHY</title>
  </head>
  <body>
    <!-- The same menu as game.html's #game-menu (shared menu.css); every
         button here expands into the game, landing where it points. -->
    <div id="game-menu">
      <div id="game-menu-header">
        <button type="button" id="game-menu-follow-btn" class="game-menu-follow-btn">
          Follow
        </button>
        <!-- Middle column: the play count, and on a level
             post the level's name under it. -->
        <div id="splash-header-center">
          <div id="splash-plays"><span id="splash-plays-value">···</span> plays</div>
          <div id="splash-level" class="hidden">
            <span id="splash-level-title"></span>
            <span id="splash-level-meta"></span>
          </div>
        </div>
        <button type="button" id="splash-build">Build</button>
      </div>
      <div id="game-menu-scene">
        <div id="menu-gag" aria-hidden="true">
          <div id="menu-gag-ground"></div>
          <div id="menu-gag-saw" class="menu-gag-sprite"><div id="menu-gag-saw-spin"></div></div>
          <div id="menu-gag-runner" class="menu-gag-sprite"></div>
          <div id="menu-gag-blood" class="menu-gag-sprite"></div>
          <div id="menu-gag-kaboom" class="menu-gag-sprite"></div>
          <div id="menu-gag-poof" class="menu-gag-sprite"></div>
        </div>
        <div id="game-menu-cta">
          <img id="game-menu-title" src="/assets/ui/title-logo.webp" alt="SKETCHY" />
          <p id="game-menu-tagline">Beat it. Make it worse. Pass it on.</p>
          <p id="game-menu-kills" class="hidden">
            <span class="game-menu-kills-skull" aria-hidden="true">☠</span>
            <span id="game-menu-kills-text"></span>
          </p>
          <button type="button" id="game-menu-play" class="game-menu-play">
            Play
          </button>
        </div>
        <div id="game-menu-attribution">
          <img id="splash-creator-avatar" class="hidden" alt="" />
          <div id="splash-creator-text">
            <span id="game-menu-attribution-label">Made by</span>
            <span id="game-menu-creator-name">SKETCHY</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
