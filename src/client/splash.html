<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>SKETCHY</title>
  </head>
  <body>
    <!-- The same menu as game.html's #game-menu (shared menu.css); every
         button here expands into the game, landing where it points. -->
    <div id="game-menu">
      <div id="game-menu-header">
        <button type="button" id="game-menu-follow-btn" class="game-menu-follow-btn">
          Follow
        </button>
        <div id="splash-level" class="hidden">
          <span id="splash-level-title"></span>
          <span id="splash-level-meta"></span>
        </div>
        <div id="game-menu-chips">
          <button type="button" id="game-menu-stats-chip" aria-label="Your stats">
            <span id="game-menu-stats-label">Your stats</span>
            <span id="game-menu-stats-badge" class="hidden"></span>
          </button>
        </div>
      </div>
      <div id="game-menu-scene">
        <div id="game-menu-cta">
          <img id="game-menu-title" src="/assets/ui/title-logo.webp" alt="SKETCHY" />
          <p id="game-menu-tagline">Beat it. Make it worse. Pass it on.</p>
          <button type="button" id="game-menu-play" class="game-menu-play">
            Play
          </button>
        </div>
        <div id="game-menu-attribution">
          <span id="game-menu-attribution-label">Made by</span>
          <span id="game-menu-creator-name">SKETCHY</span>
          <span id="game-menu-runs"><span id="game-menu-stat-value">···</span> runs on this level</span>
        </div>
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
