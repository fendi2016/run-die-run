<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>CURSED</title>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <button type="button" class="follow-button" id="follow-button">
          Follow
        </button>
        <span class="chip stat">
          <span id="stat-value">···</span>
          <span class="stat-label">RUNS</span>
        </span>
      </div>

      <div class="scene">
        <button type="button" class="secondary-button corner-button browse-button" id="browse-button">
          Browse
        </button>
        <button type="button" class="secondary-button corner-button build-button" id="build-button">
          Build
        </button>

        <div class="level-card hidden" id="level-card">
          <div class="level-daily hidden" id="level-daily"></div>
          <div class="level-title" id="level-title"></div>
          <div class="level-meta">
            <span class="level-difficulty" id="level-difficulty"></span>
            <span id="level-version"></span>
            <span id="level-clear-rate"></span>
          </div>
        </div>

        <div class="menu-stack">
          <button type="button" class="play-button" id="play-button">
            Play
          </button>
        </div>

        <div class="attribution">
          <span class="attribution-label">Made by</span>
          <span class="attribution-name" id="creator-name">CURSED</span>
        </div>
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
