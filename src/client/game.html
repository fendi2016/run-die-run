<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="game.css" />
    <title>CURSED</title>
  </head>

  <body>
    <div id="app">
      <div id="game-container"></div>
      <button type="button" id="sound-toggle" aria-label="Turn sound off" aria-pressed="true">
        <svg class="sound-on-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <svg class="sound-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
      </button>
      <button type="button" id="gameplay-menu" class="editor-btn hidden" aria-label="Pause and open game menu">Pause / Menu</button>
      <div id="gameplay-dialog" class="editor-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="gameplay-dialog-title">
        <div class="editor-dialog-panel gameplay-dialog-panel">
          <h2 id="gameplay-dialog-title"></h2>
          <p id="gameplay-dialog-message" role="status"></p>
          <div class="gameplay-actions">
            <button type="button" id="gameplay-resume" class="editor-btn editor-btn-primary">Resume</button>
            <button type="button" id="gameplay-retry-load" class="editor-btn editor-btn-primary">Retry Loading</button>
            <button type="button" id="gameplay-restart" class="editor-btn">Restart</button>
            <button type="button" id="gameplay-browse" class="editor-btn editor-btn-ghost">Browse Levels</button>
            <button type="button" id="gameplay-exit" class="editor-btn editor-btn-ghost">Exit to Menu</button>
          </div>
        </div>
      </div>
      <div id="tap-to-start" class="hidden" aria-live="polite">
        <img id="tap-to-start-logo" src="/assets/ui/tap-to-start-logo.webp" alt="" />
        <div id="tap-to-start-label">Tap to Start</div>
        <div id="tap-to-start-hint">Tap to jump · hold to jump higher</div>
      </div>
      <div id="death-panel" class="hidden" aria-live="polite">
        <div id="death-panel-attribution" class="hidden"></div>
        <div id="death-panel-kills"></div>
        <div id="death-panel-tip" class="hidden"></div>
        <div id="death-panel-actions">
          <button type="button" id="death-panel-retry-btn" class="editor-btn editor-btn-primary">
            Retry
          </button>
          <button type="button" id="death-panel-share" class="editor-btn hidden">Share</button>
          <button type="button" id="death-panel-browse" class="editor-btn">Browse</button>
          <button type="button" id="death-panel-menu" class="editor-btn">Exit to Menu</button>
        </div>
      </div>
      <div id="run-result" class="hidden" aria-live="polite">
        <div id="run-result-panel">
          <div id="run-result-title">CLEAR!</div>
          <div id="run-result-stats">
            <span id="run-result-streak"></span>
            <span id="run-result-currency"></span>
          </div>
          <div id="run-result-status">
            <div id="run-result-save-status" role="status"></div>
            <div id="run-result-next-status" role="status"></div>
          </div>
          <button type="button" id="run-result-save-retry" class="editor-btn hidden">Retry Saving Score</button>
          <div id="run-result-actions">
            <button
              type="button"
              id="run-result-curse-btn"
              class="editor-btn editor-btn-curse hidden"
            >
              Curse This Level?
            </button>
            <button type="button" id="run-result-next" class="editor-btn editor-btn-primary hidden">Next Level</button>
            <button type="button" id="run-result-share" class="editor-btn hidden">Share Your Clear</button>
          </div>
          <div id="run-result-links">
            <button type="button" id="run-result-browse" class="run-result-link">Browse</button>
            <button
              type="button"
              id="run-result-leaderboard-btn"
              class="run-result-link hidden"
            >
              Leaderboard
            </button>
            <button type="button" id="run-result-menu" class="run-result-link">Exit to Menu</button>
          </div>
        </div>
      </div>
      <div id="realtime-toast" class="hidden" aria-live="polite">
        <span id="realtime-toast-message"></span>
      </div>
      <div id="leaderboard-overlay" class="editor-dialog hidden">
        <div class="editor-dialog-panel">
          <div id="leaderboard-title">TOP CURSERS</div>
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Player</th>
                <th>Kills</th>
              </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
          <div class="editor-dialog-actions">
            <button type="button" id="leaderboard-close" class="editor-btn">
              Close
            </button>
          </div>
        </div>
      </div>
      <div id="stats-overlay" class="editor-dialog hidden">
        <div class="editor-dialog-panel">
          <div id="stats-title">YOUR STATS</div>
          <div id="stats-message" role="status" class="hidden"></div>
          <div id="stats-list">
            <div class="stats-row">
              <span class="stats-label">Shards</span>
              <span id="stats-currency">···</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Clear Streak</span>
              <span id="stats-streak">···</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Total Clears</span>
              <span id="stats-total-clears">···</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Levels Created</span>
              <span id="stats-levels-created">···</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Curse Kills</span>
              <span id="stats-contribution-kills">···</span>
            </div>
          </div>
          <div class="editor-dialog-actions">
            <button type="button" id="stats-close" class="editor-btn">
              Close
            </button>
          </div>
        </div>
      </div>
      <div id="discovery-overlay" class="editor-dialog hidden">
        <div class="editor-dialog-panel">
          <div id="discovery-header">
            <button type="button" id="discovery-back" class="editor-btn editor-btn-compact editor-btn-ghost">
              <span class="editor-btn-icon">&#8592;</span>
            </button>
            <div id="discovery-title">BROWSE LEVELS</div>
            <button type="button" id="discovery-retry" class="editor-btn editor-btn-compact">
              <span class="editor-btn-icon">&#8635;</span>
            </button>
          </div>
          <div id="discovery-sorts" class="editor-row">
            <button type="button" id="discovery-sort-trending" data-sort="trending" class="editor-btn discovery-sort-btn">Trending</button>
            <button type="button" id="discovery-sort-deadliest" data-sort="deadliest" class="editor-btn discovery-sort-btn">Deadliest</button>
            <button type="button" id="discovery-sort-speedrun" data-sort="speedrun" class="editor-btn discovery-sort-btn">Speedrun</button>
            <button type="button" id="discovery-sort-new" data-sort="new" class="editor-btn discovery-sort-btn">New</button>
          </div>
          <div id="discovery-message" role="status"></div>
          <div id="discovery-list"></div>
        </div>
      </div>
      <div id="game-menu" class="hidden">
        <div id="game-menu-header">
          <button
            type="button"
            id="game-menu-follow-btn"
            class="game-menu-follow-btn"
          >
            Follow
          </button>
          <div id="game-menu-chips">
            <button type="button" id="game-menu-currency-chip" aria-label="Your stats">
              <span id="game-menu-currency-value">···</span>
              <span id="game-menu-currency-label">SHARDS</span>
            </button>
            <span id="game-menu-chip">
              <span id="game-menu-stat-value">···</span>
              <span id="game-menu-stat-label">RUNS</span>
            </span>
          </div>
        </div>
        <div id="game-menu-scene">
          <button
            type="button"
            id="game-menu-browse"
            class="game-menu-secondary game-menu-corner game-menu-browse"
          >
            Browse
          </button>
          <button
            type="button"
            id="game-menu-leaderboard"
            class="game-menu-secondary game-menu-corner game-menu-leaderboard"
          >
            Leaderboard
          </button>
          <button
            type="button"
            id="game-menu-build"
            class="game-menu-secondary game-menu-corner game-menu-build"
          >
            Build
          </button>
          <div id="game-menu-stack">
            <div id="game-menu-status" role="status"></div>
            <button type="button" id="game-menu-play" class="game-menu-play">
              Play
            </button>
          </div>
          <div id="game-menu-attribution">
            <span id="game-menu-attribution-label">Made by</span>
            <span id="game-menu-creator-name">CURSED</span>
          </div>
        </div>
      </div>
      <div id="editor-ui" class="hidden">
        <div id="editor-message" class="hidden"></div>
        <div id="editor-toolbar">
          <div id="editor-toolbar-handle"></div>
          <div id="editor-palette" class="editor-row">
            <button type="button" id="editor-tool-select" class="editor-btn">
              <span class="editor-btn-icon">&#8598;</span>
              <span class="editor-btn-label">Select</span>
            </button>
            <span class="editor-divider"></span>
            <span class="editor-palette-group-label">Terrain</span>
            <button type="button" id="editor-tool-ground" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Ground</span>
            </button>
            <span class="editor-divider"></span>
            <span class="editor-palette-group-label">Hazards</span>
            <button type="button" id="editor-tool-spike" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/spike.webp" alt="" />
              <span class="editor-btn-label">Spike</span>
            </button>
            <button type="button" id="editor-tool-saw" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/saw-icon.webp" alt="" />
              <span class="editor-btn-label">Saw</span>
            </button>
            <button type="button" id="editor-tool-movingSaw" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/saw-icon.webp" alt="" />
              <span class="editor-btn-label">Moving Saw</span>
            </button>
            <button type="button" id="editor-tool-candle" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/candle.webp" alt="" />
              <span class="editor-btn-label">Candle</span>
            </button>
            <button type="button" id="editor-tool-bat" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/bat.webp" alt="" />
              <span class="editor-btn-label">Bat</span>
            </button>
            <button type="button" id="editor-tool-ghost" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/hazards/ghost.webp" alt="" />
              <span class="editor-btn-label">Ghost</span>
            </button>
            <span class="editor-divider"></span>
            <span class="editor-palette-group-label">Platforms</span>
            <button type="button" id="editor-tool-platform" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Platform</span>
            </button>
            <button
              type="button"
              id="editor-tool-movingPlatform"
              class="editor-btn"
            >
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Moving Platform</span>
            </button>
            <button
              type="button"
              id="editor-extend"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8596;</span>
              <span class="editor-btn-label">Extend</span>
            </button>
            <span class="editor-divider"></span>
            <span class="editor-palette-group-label">Power-Ups</span>
            <button type="button" id="editor-tool-shield" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/powerups/shield.webp" alt="" />
              <span class="editor-btn-label">Shield</span>
            </button>
            <button
              type="button"
              id="editor-tool-speedBoost"
              class="editor-btn"
            >
              <img class="editor-btn-icon-img" src="/assets/powerups/speedBoost.webp" alt="" />
              <span class="editor-btn-label">Speed Boost</span>
            </button>
            <span class="editor-divider"></span>
            <span class="editor-palette-group-label">Markers</span>
            <button type="button" id="editor-tool-spawn" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/markers/spawn.webp" alt="" />
              <span class="editor-btn-label">Spawn</span>
            </button>
            <button type="button" id="editor-tool-finish" class="editor-btn">
              <img class="editor-btn-icon-img" src="/assets/markers/finish-idle.webp" alt="" />
              <span class="editor-btn-label">Finish</span>
            </button>
          </div>
          <div id="editor-actions" class="editor-row">
            <button
              type="button"
              id="editor-pan-left"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8249;</span>
            </button>
            <button
              type="button"
              id="editor-pan-right"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8250;</span>
            </button>
            <span class="editor-divider"></span>
            <button
              type="button"
              id="editor-undo"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8630;</span>
              <span class="editor-btn-label">Undo</span>
            </button>
            <button
              type="button"
              id="editor-redo"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8631;</span>
              <span class="editor-btn-label">Redo</span>
            </button>
            <button
              type="button"
              id="editor-delete"
              class="editor-btn editor-btn-compact editor-btn-danger"
            >
              <span class="editor-btn-icon">&#9003;</span>
              <span class="editor-btn-label">Delete</span>
            </button>
            <span class="editor-divider"></span>
            <button
              type="button"
              id="editor-json"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">{ }</span>
              <span class="editor-btn-label">JSON</span>
            </button>
            <span class="editor-divider"></span>
            <button
              type="button"
              id="editor-test"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#9654;</span>
              <span class="editor-btn-label">Test</span>
            </button>
            <button
              type="button"
              id="editor-publish"
              class="editor-btn editor-btn-compact editor-btn-primary"
            >
              <span class="editor-btn-icon">&#8593;</span>
              <span class="editor-btn-label">Publish</span>
            </button>
            <button
              type="button"
              id="editor-exit"
              class="editor-btn editor-btn-compact editor-btn-ghost"
            >
              <span class="editor-btn-icon">&#8592;</span>
              <span class="editor-btn-label">Exit</span>
            </button>
          </div>
        </div>
      </div>
      <div id="editor-publish-dialog" class="editor-dialog hidden">
        <div class="editor-dialog-panel">
          <label for="editor-title-input">Level title</label>
          <input
            id="editor-title-input"
            type="text"
            maxlength="60"
            placeholder="My Level"
          />
          <div class="editor-dialog-actions">
            <button type="button" id="editor-publish-cancel" class="editor-btn">
              Cancel
            </button>
            <button
              type="button"
              id="editor-publish-confirm"
              class="editor-btn editor-btn-primary"
            >
              Publish
            </button>
          </div>
        </div>
      </div>
      <div id="editor-json-dialog" class="editor-dialog hidden">
        <div class="editor-dialog-panel">
          <label for="editor-json-textarea">Level JSON</label>
          <textarea
            id="editor-json-textarea"
            spellcheck="false"
            placeholder="[]"
          ></textarea>
          <div id="editor-json-error" class="hidden"></div>
          <div class="editor-dialog-actions">
            <button type="button" id="editor-json-cancel" class="editor-btn">
              Close
            </button>
            <button type="button" id="editor-json-copy" class="editor-btn">
              Copy
            </button>
            <button
              type="button"
              id="editor-json-load"
              class="editor-btn editor-btn-primary"
            >
              Load
            </button>
          </div>
        </div>
      </div>
      <div id="editor-preview-back" class="hidden">
        <button type="button" id="editor-preview-back-btn">
          ← Back to Editor
        </button>
      </div>
      <div id="curse-ui" class="hidden">
        <div id="curse-message" class="hidden"></div>
        <div id="curse-toolbar">
          <div id="curse-toolbar-handle"></div>
          <div id="curse-row" class="editor-row">
            <button type="button" id="curse-category-hazard" class="editor-btn">
              <span class="editor-btn-icon">&#9888;</span>
              <span class="editor-btn-label">Hazard</span>
            </button>
            <button
              type="button"
              id="curse-category-platform"
              class="editor-btn"
            >
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Platform</span>
            </button>
            <button
              type="button"
              id="curse-category-powerUp"
              class="editor-btn"
            >
              <span class="editor-btn-icon">&#9889;</span>
              <span class="editor-btn-label">Power-Up</span>
            </button>
            <span class="editor-divider"></span>
            <button
              type="button"
              id="curse-type-spike"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/hazards/spike.webp" alt="" />
              <span class="editor-btn-label">Spike</span>
            </button>
            <button type="button" id="curse-type-saw" class="editor-btn hidden">
              <img class="editor-btn-icon-img" src="/assets/hazards/saw-icon.webp" alt="" />
              <span class="editor-btn-label">Saw</span>
            </button>
            <button
              type="button"
              id="curse-type-movingSaw"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/hazards/saw-icon.webp" alt="" />
              <span class="editor-btn-label">Moving Saw</span>
            </button>
            <button
              type="button"
              id="curse-type-candle"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/hazards/candle.webp" alt="" />
              <span class="editor-btn-label">Candle</span>
            </button>
            <button type="button" id="curse-type-bat" class="editor-btn hidden">
              <img class="editor-btn-icon-img" src="/assets/hazards/bat.webp" alt="" />
              <span class="editor-btn-label">Bat</span>
            </button>
            <button
              type="button"
              id="curse-type-ghost"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/hazards/ghost.webp" alt="" />
              <span class="editor-btn-label">Ghost</span>
            </button>
            <button
              type="button"
              id="curse-type-platform"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Platform</span>
            </button>
            <button
              type="button"
              id="curse-type-movingPlatform"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/tiles/platform/platform-top-center-1.webp" alt="" />
              <span class="editor-btn-label">Moving Platform</span>
            </button>
            <button
              type="button"
              id="curse-extend"
              class="editor-btn editor-btn-compact hidden"
            >
              <span class="editor-btn-icon">&#8596;</span>
              <span class="editor-btn-label">Extend</span>
            </button>
            <button
              type="button"
              id="curse-remove"
              class="editor-btn editor-btn-compact hidden"
            >
              <span class="editor-btn-icon">&#8854;</span>
              <span class="editor-btn-label">Remove</span>
            </button>
            <button
              type="button"
              id="curse-type-shield"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/powerups/shield.webp" alt="" />
              <span class="editor-btn-label">Shield</span>
            </button>
            <button
              type="button"
              id="curse-type-speedBoost"
              class="editor-btn hidden"
            >
              <img class="editor-btn-icon-img" src="/assets/powerups/speedBoost.webp" alt="" />
              <span class="editor-btn-label">Speed Boost</span>
            </button>
          </div>
          <div id="curse-actions" class="editor-row">
            <button
              type="button"
              id="curse-pan-left"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8249;</span>
            </button>
            <button
              type="button"
              id="curse-pan-right"
              class="editor-btn editor-btn-compact"
            >
              <span class="editor-btn-icon">&#8250;</span>
            </button>
            <span class="editor-divider"></span>
            <button
              type="button"
              id="curse-clear"
              class="editor-btn editor-btn-compact editor-btn-danger"
            >
              <span class="editor-btn-icon">&#9003;</span>
              <span class="editor-btn-label">Clear</span>
            </button>
            <button
              type="button"
              id="curse-prove"
              class="editor-btn editor-btn-compact editor-btn-primary"
            >
              <span class="editor-btn-label">Prove It's Possible</span>
            </button>
            <button
              type="button"
              id="curse-cancel"
              class="editor-btn editor-btn-compact editor-btn-ghost"
            >
              <span class="editor-btn-icon">&#8592;</span>
              <span class="editor-btn-label">Cancel</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="game.ts"></script>
  </body>
</html>
